on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

name: build

jobs:
  build:

    runs-on: ubuntu-latest

    env:
      # packages are installed below, so don't let the renv .Rprofile take over
      RENV_AUTOLOADER_ENABLED: false
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:

    - name: Check out the repository
      uses: actions/checkout@v4

    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: release
        use-public-rspm: true

    - name: Install R packages (and the system libraries they need)
      shell: Rscript {0}
      run: |
        install.packages("pak")
        pak::pkg_install(c("sf", "fs", "tidyverse", "data.table", "igraph", "terra",
                           "lwgeom", "tidytransit", "hablar", "hms", "osmextract",
                           "doSNOW", "foreach", "nngeo", "gtfsio", "raster", "units",
                           "RSQLite", "yaml", "testthat"))

    - name: Test MATSim network generation
      shell: Rscript {0}
      run: |
        testthat::test_dir("tests/testthat", stop_on_failure = TRUE)
